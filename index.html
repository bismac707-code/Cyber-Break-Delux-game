<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberBreak - Offline Arcade Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .stats {
      display: flex;
      gap: 24px;
      font-weight: 600;
      font-size: 1.1rem;
      margin-top: 4px;
      color: #94a3b8;
    }
    .stats span { color: #f43f5e; }
    #gameContainer {
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #334155;
    }
    canvas {
      background: #1e293b;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .overlay h2 { font-size: 2.2rem; color: #38bdf8; }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .instructions {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Cyber Break</h1>
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Level: <span id="level">1</span></div>
    </div>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">CYBER BREAK</h2>
      <p id="overlayDesc" style="color: #94a3b8;">Break all bricks to advance levels.</p>
      <button class="btn" id="startBtn" onclick="startGame()">PLAY GAME</button>
    </div>
  </div>

  <div class="instructions">
    Use <b>Left / Right Arrow Keys</b> or <b>Move Mouse</b> to control the paddle.
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const levelEl = document.getElementById("level");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayDesc = document.getElementById("overlayDesc");

    // Audio Synthesis (Web Audio API - Offline Native)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game Variables
    let score = 0;
    let lives = 3;
    let level = 1;
    let isPlaying = false;
    let animationId = null;

    // Paddle Setup
    const paddle = {
      height: 12,
      width: 90,
      x: (canvas.width - 90) / 2,
      speed: 7,
      dx: 0
    };

    // Ball Setup
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 30,
      radius: 7,
      speed: 4,
      dx: 4,
      dy: -4
    };

    // Bricks Setup
    const brickConfig = {
      rowCount: 4,
      columnCount: 7,
      padding: 10,
      offsetTop: 40,
      offsetLeft: 35,
      height: 18
    };
    brickConfig.width = (canvas.width - (brickConfig.offsetLeft * 2) - (brickConfig.padding * (brickConfig.columnCount - 1))) / brickConfig.columnCount;

    let bricks = [];
    const brickColors = ["#f43f5e", "#fb923c", "#facc15", "#4ade80"];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickConfig.columnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickConfig.rowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r % brickColors.length] };
        }
      }
    }

    // Key handlers
    let rightPressed = false;
    let leftPressed = false;

    document.addEventListener("keydown", (e) => {
      if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
      if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
      if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
    });

    document.addEventListener("mousemove", (e) => {
      const relativeX = e.clientX - canvas.offsetLeft;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.width / 2;
      }
    });

    function collisionDetection() {
      for (let c = 0; c < brickConfig.columnCount; c++) {
        for (let r = 0; r < brickConfig.rowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            if (
              ball.x > b.x &&
              ball.x < b.x + brickConfig.width &&
              ball.y > b.y &&
              ball.y < b.y + brickConfig.height
            ) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 10 * level;
              scoreEl.textContent = score;
              playTone(440 + (r * 60), "sine", 0.1);

              // Level cleared check
              if (score === brickConfig.rowCount * brickConfig.columnCount * 10 * level) {
                level++;
                levelEl.textContent = level;
                playTone(880, "triangle", 0.3);
                resetBallAndPaddle();
                ball.speed += 1;
                initBricks();
              }
            }
          }
        }
      }
    }

    function resetBallAndPaddle() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 30;
      ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -ball.speed;
      paddle.x = (canvas.width - paddle.width) / 2;
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#38bdf8";
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.roundRect(paddle.x, canvas.height - paddle.height - 10, paddle.width, paddle.height, 6);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      for (let c = 0; c < brickConfig.columnCount; c++) {
        for (let r = 0; r < brickConfig.rowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
            const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickConfig.width, brickConfig.height, 4);
            ctx.fillStyle = bricks[c][r].color;
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function update() {
      if (!isPlaying) return;

      // Move Paddle
      if (rightPressed && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.speed;
      } else if (leftPressed && paddle.x > 0) {
        paddle.x -= paddle.speed;
      }

      // Ball Wall Collisions
      if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
        ball.dx = -ball.dx;
        playTone(200, "square", 0.05);
      }
      if (ball.y + ball.dy < ball.radius) {
        ball.dy = -ball.dy;
        playTone(200, "square", 0.05);
      } else if (ball.y + ball.dy > canvas.height - ball.radius - 10) {
        // Paddle collision
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
          // Angle modifier depending on hit position
          let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          ball.dx = hitPoint * ball.speed;
          ball.dy = -Math.sqrt(Math.max(1, ball.speed * ball.speed - ball.dx * ball.dx));
          playTone(300, "sine", 0.08);
        } else {
          // Life Lost
          lives--;
          livesEl.textContent = lives;
          playTone(120, "sawtooth", 0.2);
          if (lives <= 0) {
            gameOver();
            return;
          } else {
            resetBallAndPaddle();
          }
        }
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      collisionDetection();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
    }

    function loop() {
      update();
      draw();
      if (isPlaying) {
        animationId = requestAnimationFrame(loop);
      }
    }

    function startGame() {
      score = 0;
      lives = 3;
      level = 1;
      ball.speed = 4;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
      initBricks();
      resetBallAndPaddle();
      overlay.style.display = "none";
      isPlaying = true;
      loop();
    }

    function gameOver() {
      isPlaying = false;
      cancelAnimationFrame(animationId);
      overlayTitle.textContent = "GAME OVER";
      overlayDesc.textContent = `Final Score: ${score}`;
      document.getElementById("startBtn").textContent = "TRY AGAIN";
      overlay.style.display = "flex";
    }

    initBricks();
    draw();
  </script>
</body>
</html>
